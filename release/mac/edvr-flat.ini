# ED Unofficial Patch for Mac -- default settings.
# Put this file next to EliteDangerous64.exe. Press F8 in the game to change
# any of these from the menu; the menu writes them back here.
# A setting left out of this file uses its built-in default.

[fix]
# Anti-aliasing: off, fsr (FSR 3.1) or mfx (MetalFX). The game's
# Supersampling sets the render size the upscaler starts from.
temporal_aa = mfx
ui_quality = 100
hud_antialiasing = off
render_sharpness = 0.5
optimized_stations = on
station_window_distance = 100
skip_rooms_behind_doors = on
character_motion = on
# HDR output on an EDR (XDR, HDR) display. Takes a game restart.
hdr = on

[visual]
intro_video = skip
star_glow = 100
# Star-coloured lighting, in percent (0 is the game's own white light).
star_light_colour = 100
cockpit_glass = odyssey
cockpit_glass_dirt = 100
cockpit_glass_lights = station

[advanced]
# HDR whites: scene white follows macOS's own SDR white (auto), UI white in nits.
hdr_scene_nits = auto
hdr_ui_nits = 500
hdr_highlights = hue
hdr_grading = game
# The d3d11.dll this one passes everything through (EDHM, ReShade). Empty: none.
real_dll =

[hotkey]
menu = F8
compare_aa = F7

[menu]
fps_overlay = off
fps_overlay_lock = off

[log]
enabled = 1
